    <div id="tech-cursor"></div>
    <div id="tech-cursor-follower"></div>
    <div id="progress-bar"></div>
    <div class="animated-lines-container"></div>

    <section class="section" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div class="container text-center">
            <div class="tech-card" style="max-width: 600px; margin: 0 auto; padding: 60px;">
                <h1 style="font-size: 8rem; color: var(--secondary);">404</h1>
                <h2 class="mb-4">Page Not Found</h2>
                <p class="mb-5">The requested URL was not found on this server. Let's get you back to the main system.</p>
                
                <a href="/index.html" class="btn btn-tech">Return to Homepage</a>
            </div>
        </div>
    </section>
<footer class="tech-footer" id="footer-placeholder">
</footer>
    <script>
        // Tech Cursor Logic
        const cursor = document.getElementById('tech-cursor');
        const follower = document.getElementById('tech-cursor-follower');

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            
            setTimeout(() => {
                follower.style.left = e.clientX + 'px';
                follower.style.top = e.clientY + 'px';
            }, 50);
        });

        // Scroll Progress Bar
        window.onscroll = () => {
            let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            let scrolled = (winScroll / height) * 100;
            document.getElementById('progress-bar').style.width = scrolled + "%";
        };
    </script>
</body>
</html>
