<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | الصفحة غير موجودة</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px 20px;
        }
        .error-content {
            background: var(--bg-surface);
            padding: 60px;
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--secondary);
            max-width: 600px;
            width: 100%;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 4px 4px 0px var(--secondary-glow);
        }
    </style>
</head>
<body>

    <section class="error-section">
        <div class="error-content tech-card">
            <div class="error-code">404</div>
            <h2 class="mb-4">عذراً، المسار غير موجود!</h2>
            <p class="mb-4">يبدو أن الصفحة التي تبحث عنها قد تم نقلها أو أنها غير موجودة. دعنا نعيدك إلى بر الأمان.</p>
            
            <div class="mt-5">
                <a href="home.html" class="btn btn-tech">العودة للرئيسية</a>
            </div>
        </div>
    </section>
 <!-- Scripts -->
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <!-- Vanilla Tilt for Tech 3D effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
