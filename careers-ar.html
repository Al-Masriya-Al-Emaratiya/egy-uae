<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@500;700&display=anonymous" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .construction-hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .construction-card {
            background: var(--glass-bg);
            padding: 60px 40px;
            border: 1px solid var(--border-color);
            border-radius: 0; 
            box-shadow: var(--card-shadow);
            text-align: center;
            max-width: 600px;
            width: 100%;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .construction-card:hover {
            border-color: var(--primary);
            box-shadow: var(--card-hover-shadow);
        }

        .square-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary);
            border-right: 3px solid var(--secondary);
            border-radius: 0; 
            margin: 40px auto 0;
            animation: spin 1.2s cubic-bezier(0.23, 1, 0.32, 1) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .construction-card p {
            font-size: 1.15rem;
            margin-bottom: 10px;
            color: var(--text-medium);
        }
    </style>
</head>
<body>

    <div id="progress-bar"></div>
    <div class="animated-lines-container"></div>
    
    <div id="cursor"></div>

    <section class="construction-hero">
        <div class="construction-card hero-3d-card" id="tilt-card">
            
            <div data-z="40">
                <h1 class="hero-title" style="font-size: clamp(2rem, 5vw, 3.5rem); margin-bottom: 25px;">
                    Under Construction
                </h1>
            </div>
            
            <div data-z="20">
                <p>Our team is working hard to bring you an amazing experience!</p>
            </div>
            
            <div data-z="10">
                <p style="color: var(--text-dark);">We appreciate your patience.</p>
            </div>
            
            <div data-z="30">
                <div class="square-spinner"></div>
            </div>
            
        </div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
