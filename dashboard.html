<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard | EGY UAE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@300;500;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <style>
        body {
            background-color: #f4f7fb; 
            background-image: radial-gradient(circle at top right, rgba(23, 67, 136, 0.05), transparent),
                              radial-gradient(circle at bottom left, rgba(213, 36, 43, 0.03), transparent);
            min-height: 100vh;
            color: var(--text-main);
        }

        .demo-alert-bar {
            background: linear-gradient(90deg, #d5242b 0%, #174388 100%);
            color: #ffffff;
            text-align: center;
            padding: 8px 20px;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .demo-alert-bar i {
            animation: pulse-icon 1.5s infinite;
        }
        @keyframes pulse-icon {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .page-section {
            display: none;
        }
        .page-section.active-page {
            display: block;
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .badge { padding: 4px 10px; font-weight: bold; font-size: 0.85rem; border-radius: 4px; }
        .status-customs { background: rgba(213, 36, 43, 0.1); color: #d5242b; border: 1px solid rgba(213, 36, 43, 0.2); }
        .status-transit { background: rgba(23, 67, 136, 0.1); color: #174388; border: 1px solid rgba(23, 67, 136, 0.2); }
        .status-success { background: rgba(40, 167, 69, 0.1); color: #28a745; border: 1px solid rgba(40, 167, 69, 0.2); }
        
        .action-link {
            color: #174388;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .action-link:hover {
            color: #d5242b;
        }
    </style>
</head>
<body>

<h1>Soon</h1>

    <script src="js/main.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
