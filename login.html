<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Portal | Al Masriya Al Emaratiya</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .portal-wrapper {
            width: 100%;
            max-width: 600px;
            position: relative;
            z-index: 10;
        }

        .portal-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .portal-header h2 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px rgba(23,67,136,0.1);
        }

        /* تعديل الأزرار لتتناسب مع التبديل بين الأفراد والشركات */
        .account-type-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .account-type-selector .btn {
            flex: 1;
            padding: 10px;
        }

        .toggle-form {
            margin-top: 25px;
            text-align: center;
            font-weight: 500;
        }
        
        .toggle-form a {
            cursor: pointer;
            font-weight: 700;
            border-bottom: 1px dashed var(--primary);
        }

        .toggle-form a:hover {
            color: var(--secondary);
            border-color: var(--secondary);
        }

        .msg-box {
            margin-top: 20px;
            padding: 15px;
            border-left: 4px solid var(--primary);
            background: var(--bg-surface);
            display: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .msg-box.error { border-left-color: var(--secondary); color: var(--secondary); }
        .msg-box.success { border-left-color: #10b981; color: #10b981; }

        .cf-turnstile { display: flex; justify-content: center; margin: 20px 0; }
        
        .grid-2-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }

        @media (max-width: 600px) {
            .grid-2-inputs { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div id="tech-cursor"></div>
    <div id="tech-cursor-follower"></div>

    <div class="animated-lines-container"></div>

    <div class="portal-wrapper">
        <div class="tech-card glass-panel tilt-card">
            
            <div class="portal-header">
                <h2>AL MASRIYA AL EMARATIYA</h2>
                <p>Commercial Agencies, Import & Export Global Portal</p>
                <div class="header-line mt-4"></div>
            </div>
            
            <div id="loginSection">
                <form id="loginForm">
                    <div id="loginStep1">
                        <div class="input-group">
                            <input type="email" id="loginEmail" placeholder="Business Email Address" required>
                            <i class="fas fa-envelope"></i>
                        </div>
                        <div class="cf-turnstile turnstile-container" data-sitekey="0x4AAAAAADc5YsoI3mSefPp2" data-theme="light"></div>
                        <button type="submit" class="btn btn-tech w-full" id="btnSendCode">
                            <i class="fas fa-paper-plane"></i> Send Access Code
                        </button>
                    </div>

                    <div id="loginStep2" class="hidden mt-4">
                        <p class="mb-4" style="font-size: 0.9rem; color: var(--primary); font-weight: bold;">
                            <i class="fas fa-check-circle"></i> Access code sent to your email.
                        </p>
                        <div class="input-group">
                            <input type="text" id="loginCode" placeholder="Enter 6-digit Code">
                            <i class="fas fa-key"></i>
                        </div>
                        <button type="button" class="btn btn-tech w-full" id="btnVerifyCode">
                            <i class="fas fa-unlock-alt"></i> Verify & Login
                        </button>
                    </div>
                </form>

                <div class="toggle-form">
                    New Trader? <a onclick="switchForm('register')">Apply for Membership</a>
                </div>
            </div>

            <!-- قسم تسجيل تاجر جديد -->
            <div id="registerSection" class="hidden">
                <div class="account-type-selector">
                    <button type="button" class="btn btn-tech" id="btnIndividual" onclick="setAccountType('individual')">Individual</button>
                    <button type="button" class="btn btn-outline-tech" id="btnCompany" onclick="setAccountType('company')">Company</button>
                </div>

                <form id="registerForm">
                    <div class="grid-2-inputs">
                        <div class="input-group full-width">
                            <input type="text" id="regName" placeholder="Full Name (Account Manager)" required>
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="input-group">
                            <input type="email" id="regEmail" placeholder="Business Email" required>
                            <i class="fas fa-envelope"></i>
                        </div>
                        <div class="input-group">
                            <input type="tel" id="regPhone" placeholder="Phone (WhatsApp)" required>
                            <i class="fas fa-phone"></i>
                        </div>
                        
                        <div class="input-group full-width">
                            <!-- بالنسبة للـ select نضعه أيضاً مع الأيقونة -->
                            <select id="regBusinessCategory" onchange="checkCategory(this.value)" required style="width: 100%; padding: 15px 15px 15px 45px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); font-family: inherit; font-size: 1rem;">
                                <option value="" disabled selected>Select Business Sector...</option>
                                <option value="General Trading">General Trading</option>
                                <option value="Import & Export">Import & Export</option>
                                <option value="Logistics & Shipping">Logistics & Shipping</option>
                                <option value="Agriculture & Food">Agriculture & Food Industry</option>
                                <option value="Textiles & Garments">Textiles & Garments</option>
                                <option value="Electronics & Tech">Electronics & Technology</option>
                                <option value="Building Materials">Construction & Building</option>
                                <option value="Other">Other Sector...</option>
                            </select>
                            <i class="fas fa-tags" style="position: absolute; top: 16px; left: 16px; color: var(--primary); opacity: 0.6;"></i>
                        </div>

                        <div class="input-group full-width hidden" id="customCategoryGroup">
                            <input type="text" id="regCustomCategory" placeholder="Please specify your business sector">
                            <i class="fas fa-pen"></i>
                        </div>

                        <div class="input-group company-field hidden full-width">
                            <input type="text" id="regCompanyName" placeholder="Official Company Name">
                            <i class="fas fa-building"></i>
                        </div>
                        <div class="input-group company-field hidden full-width">
                            <input type="text" id="regSerial" placeholder="Commercial Registration No. (CR)">
                            <i class="fas fa-file-contract"></i>
                        </div>
                    </div>
                    
                    <div class="cf-turnstile turnstile-container full-width" data-sitekey="0x4AAAAAADc5YsoI3mSefPp2" data-theme="light"></div>

                    <button type="submit" class="btn btn-tech w-full">
                        <i class="fas fa-rocket"></i> Submit Application
                    </button>
                </form>
                
                <div class="toggle-form">
                    Already approved? <a onclick="switchForm('login')">Sign In with Code</a>
                </div>
            </div>

            <div id="responseMsg" class="msg-box"></div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

    <script>
        const SUPABASE_URL = "https://covjkdevidieohlqwqwt.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_CGzcIbX9idzzqKURAPOAGg_nri9g4iS";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentAccountType = 'individual';
        const msgDiv = document.getElementById('responseMsg');

        function switchForm(type) {
            msgDiv.style.display = 'none';
            if(type === 'register') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('registerSection').classList.remove('hidden');
            } else {
                document.getElementById('registerSection').classList.add('hidden');
                document.getElementById('loginSection').classList.remove('hidden');
            }
        }

        function setAccountType(type) {
            currentAccountType = type;
            const compFields = document.querySelectorAll('.company-field');
            const btnInd = document.getElementById('btnIndividual');
            const btnComp = document.getElementById('btnCompany');

            if(type === 'company') {
                btnComp.className = 'btn btn-tech';
                btnInd.className = 'btn btn-outline-tech';
                compFields.forEach(f => f.classList.remove('hidden'));
                document.getElementById('regCompanyName').required = true;
                document.getElementById('regSerial').required = true;
            } else {
                btnInd.className = 'btn btn-tech';
                btnComp.className = 'btn btn-outline-tech';
                compFields.forEach(f => f.classList.add('hidden'));
                document.getElementById('regCompanyName').required = false;
                document.getElementById('regSerial').required = false;
            }
        }

        function checkCategory(value) {
            const customGroup = document.getElementById('customCategoryGroup');
            const customInput = document.getElementById('regCustomCategory');
            if(value === 'Other') {
                customGroup.classList.remove('hidden');
                customInput.required = true;
            } else {
                customGroup.classList.add('hidden');
                customInput.required = false;
            }
        }

        function showMessage(text, type) {
            msgDiv.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check' : 'fa-exclamation-triangle'}"></i> ` + text;
            msgDiv.className = `msg-box ${type}`;
            msgDiv.style.display = 'block';
        }

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const phone = document.getElementById('regPhone').value;
            
            let finalCategory = document.getElementById('regBusinessCategory').value;
            if(finalCategory === 'Other') finalCategory = document.getElementById('regCustomCategory').value;

            const companyName = document.getElementById('regCompanyName').value;
            const serialNo = document.getElementById('regSerial').value;

            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            btn.disabled = true;

            const autoGeneratedPassword = Math.random().toString(36).slice(-10) + "A1!xZ";

            const { data, error } = await _supabase.auth.signUp({
                email: email,
                password: autoGeneratedPassword, 
                options: {
                    data: {
                        full_name: name,
                        phone_number: phone,
                        account_type: currentAccountType,
                        business_sector: finalCategory,
                        company_name: currentAccountType === 'company' ? companyName : 'N/A',
                        commercial_registration: currentAccountType === 'company' ? serialNo : 'N/A',
                        is_approved: true 
                    }
                }
            });

            btn.innerHTML = originalText;
            btn.disabled = false;
            if (typeof turnstile !== 'undefined') turnstile.reset();

            if (error) {
                showMessage(error.message, 'error');
            } else {
                showMessage("Your application is submitted successfully! You will login using Email Code.", 'success');
                document.getElementById('registerForm').reset();
                setTimeout(() => switchForm('login'), 3500);
            }
        });

        // ----------------------------------------
        // 2. تسجيل الدخول (نظام الـ OTP بدون باسورد)
        // ----------------------------------------
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const btn = document.getElementById('btnSendCode');
            
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            btn.disabled = true;

            const { data, error } = await _supabase.auth.signInWithOtp({
                email: email,
                options: {
                    shouldCreateUser: false 
                }
            });

            btn.innerHTML = originalText;
            btn.disabled = false;

            if (error) { 
                showMessage(error.message, 'error'); 
                if (typeof turnstile !== 'undefined') turnstile.reset();
            } else {
                showMessage("Code Sent Successfully!", 'success');

                document.getElementById('loginStep1').classList.add('hidden');
                document.getElementById('loginStep2').classList.remove('hidden');
            }
        });

        document.getElementById('btnVerifyCode').addEventListener('click', async function() {
            const email = document.getElementById('loginEmail').value;
            const code = document.getElementById('loginCode').value;
            const btn = document.getElementById('btnVerifyCode');

            if(!code) {
                showMessage("Please enter the code", "error");
                return;
            }

            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
            btn.disabled = true;

            const { data: { session }, error } = await _supabase.auth.verifyOtp({
                email: email,
                token: code,
                type: 'email'
            });

            btn.innerHTML = originalText;
            btn.disabled = false;

            if (error) {
                showMessage("Invalid or expired code.", 'error');
            } else {

                const metadata = session.user.user_metadata || {};
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('username', email);
                localStorage.setItem('userData', JSON.stringify({
                    name: metadata.full_name || 'Trader',
                    role: metadata.account_type === 'company' ? `Corporate: ${metadata.company_name}` : "Individual Trader"
                }));
                
                showMessage("Authentication verified! Redirecting...", 'success');
                
                setTimeout(() => {
                    window.location.href = 'index.html'; 
                }, 1500);
            }
        });
    </script>
</body>
</html>
