<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login | Al Masriya Al Emaratiya</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        :root {
            --primary: #007bff;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Tajawal', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 { margin-bottom: 20px; }
        .input-group {
            margin-bottom: 20px;
            position: relative;
            text-align: left;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 15px;
            color: #666;
        }
        .input-group input {
            width: 100%;
            padding: 12px 12px 12px 45px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
        }
        .input-group input:focus {
            border-color: var(--primary);
            outline: none;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        .error-msg {
            color: #ff4d4d;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>AL MASRIYA AL EMARATIYA</h2>
        <p>Login to your Dashboard</p>
        
        <form id="loginForm">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-submit">Login</button>
            <div id="errorMsg" class="error-msg">Incorrect username or password!</div>
        </form>
    </div>

    <script>
        const usersDatabase = {
            "admin": { password: "123", role: "Manager", name: "Omar Al Fares" },
            "client1": { password: "456", role: "Client", name: "Latifa Hassan" }
        };

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const userIn = document.getElementById('username').value;
            const passIn = document.getElementById('password').value;
            const errorElement = document.getElementById('errorMsg');

            if (usersDatabase[userIn] && usersDatabase[userIn].password === passIn) {
                
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('username', userIn);
                sessionStorage.setItem('userData', JSON.stringify(usersDatabase[userIn]));

                window.location.href = 'dashboard.html';
            } else {
                errorElement.style.display = 'block';
            }
        });
    </script>
</body>
</html>
