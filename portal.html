<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Portal | Al Masriya Al Emaratiya</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <style>
        body { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px; 
            
            background-image: url('background.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 14, 28, 0.65); 
            z-index: 0;
            pointer-events: none;
        }

        .portal-wrapper { width: 100%; max-width: 600px; position: relative; z-index: 10; }
        .animated-lines-container { z-index: 1; }
        
        .portal-header { text-align: center; margin-bottom: 30px; }
        .portal-header h2 { font-size: 2rem; margin-bottom: 10px; text-shadow: 2px 2px 0px rgba(23,67,136,0.1); }
        .account-type-selector { display: flex; gap: 15px; margin-bottom: 30px; }
        .account-type-selector .btn { flex: 1; padding: 10px; }
        .toggle-form { margin-top: 25px; text-align: center; font-weight: 500; }
        .toggle-form a { cursor: pointer; font-weight: 700; border-bottom: 1px dashed var(--primary); }
        .toggle-form a:hover { color: var(--secondary); border-color: var(--secondary); }
        .msg-box { margin-top: 20px; padding: 15px; border-left: 4px solid var(--primary); background: var(--bg-surface); display: none; font-weight: 600; font-size: 0.9rem; }
        .msg-box.error { border-left-color: var(--secondary); color: var(--secondary); }
        .msg-box.success { border-left-color: #10b981; color: #10b981; }
        .cf-turnstile { display: flex; justify-content: center; margin: 20px 0; }
        .grid-2-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        @media (max-width: 600px) { .grid-2-inputs { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div id="tech-cursor"></div>
    <div id="tech-cursor-follower"></div>
    <div class="animated-lines-container"></div>

    <div class="portal-wrapper">
        <div class="tech-card glass-panel tilt-card">
            
            <div class="portal-header">
                <h2>AL MASRIYA AL EMARATIYA</h2>
                <p>Commercial Agencies, Import & Export Global Portal</p>
                <div class="header-line mt-4"></div>
            </div>
            
            <div id="loginSection">
                <form id="loginForm">
                    <div class="input-group">
                        <input type="email" id="loginEmail" placeholder="Business Email Address" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="input-group mt-3">
                        <input type="text" id="loginCode" placeholder="Access Code (Provided by Admin)" required>
                        <i class="fas fa-key"></i>
                    </div>
                    <div class="cf-turnstile turnstile-container" data-sitekey="0x4AAAAAADc5YsoI3mSefPp2" data-theme="light"></div>
                    <button type="submit" class="btn btn-tech w-full">
                        <i class="fas fa-unlock-alt"></i> Login to Portal
                    </button>
                </form>

                <div class="toggle-form">
                    New Trader? <a onclick="switchForm('register')">Apply for Membership</a>
                </div>
            </div>

            <div id="registerSection" class="hidden">
                <div class="account-type-selector">
                    <button type="button" class="btn btn-tech" id="btnIndividual" onclick="setAccountType('individual')">Individual</button>
                    <button type="button" class="btn btn-outline-tech" id="btnCompany" onclick="setAccountType('company')">Company</button>
                </div>

                <!-- Formspree Endpoint -->
                <form id="registerForm">
                    <div class="grid-2-inputs">
                        <div class="input-group full-width">
                            <input type="text" name="Account_Manager" id="regName" placeholder="Full Name (Account Manager)" required>
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="input-group">
                            <input type="email" name="Email" id="regEmail" placeholder="Business Email" required>
                            <i class="fas fa-envelope"></i>
                        </div>
                        <div class="input-group">
                            <input type="tel" name="Phone_WhatsApp" id="regPhone" placeholder="Phone (WhatsApp)" required>
                            <i class="fas fa-phone"></i>
                        </div>
                        
                        <div class="input-group full-width">
                            <select name="Business_Sector" id="regBusinessCategory" onchange="checkCategory(this.value)" required style="width: 100%; padding: 15px 15px 15px 45px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); font-family: inherit; font-size: 1rem;">
                                <option value="" disabled selected>Select Business Sector...</option>
                                <option value="General Trading">General Trading</option>
                                <option value="Import & Export">Import & Export</option>
                                <option value="Logistics & Shipping">Logistics & Shipping</option>
                                <option value="Agriculture & Food">Agriculture & Food Industry</option>
                                <option value="Textiles & Garments">Textiles & Garments</option>
                                <option value="Electronics & Tech">Electronics & Technology</option>
                                <option value="Building Materials">Construction & Building</option>
                                <option value="Other">Other Sector...</option>
                            </select>
                            <i class="fas fa-tags" style="position: absolute; top: 16px; left: 16px; color: var(--primary); opacity: 0.6;"></i>
                        </div>

                        <div class="input-group full-width hidden" id="customCategoryGroup">
                            <input type="text" name="Custom_Sector" id="regCustomCategory" placeholder="Please specify your business sector">
                            <i class="fas fa-pen"></i>
                        </div>

                        <div class="input-group company-field hidden full-width">
                            <input type="text" name="Company_Name" id="regCompanyName" placeholder="Official Company Name">
                            <i class="fas fa-building"></i>
                        </div>
                        <div class="input-group company-field hidden full-width">
                            <input type="text" name="Commercial_Registration" id="regSerial" placeholder="Commercial Registration No. (CR)">
                            <i class="fas fa-file-contract"></i>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-tech w-full mt-4">
                        <i class="fas fa-paper-plane"></i> Submit Application
                    </button>
                </form>
                
                <div class="toggle-form">
                    Already approved? <a onclick="switchForm('login')">Sign In with Code</a>
                </div>
            </div>

            <div id="responseMsg" class="msg-box"></div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

    <script>
        let currentAccountType = 'individual';
        const msgDiv = document.getElementById('responseMsg');

        function switchForm(type) {
            msgDiv.style.display = 'none';
            if(type === 'register') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('registerSection').classList.remove('hidden');
            } else {
                document.getElementById('registerSection').classList.add('hidden');
                document.getElementById('loginSection').classList.remove('hidden');
            }
        }

        function setAccountType(type) {
            currentAccountType = type;
            const compFields = document.querySelectorAll('.company-field');
            const btnInd = document.getElementById('btnIndividual');
            const btnComp = document.getElementById('btnCompany');

            if(type === 'company') {
                btnComp.className = 'btn btn-tech';
                btnInd.className = 'btn btn-outline-tech';
                compFields.forEach(f => f.classList.remove('hidden'));
                document.getElementById('regCompanyName').required = true;
                document.getElementById('regSerial').required = true;
            } else {
                btnInd.className = 'btn btn-tech';
                btnComp.className = 'btn btn-outline-tech';
                compFields.forEach(f => f.classList.add('hidden'));
                document.getElementById('regCompanyName').required = false;
                document.getElementById('regSerial').required = false;
            }
        }

        function checkCategory(value) {
            const customGroup = document.getElementById('customCategoryGroup');
            const customInput = document.getElementById('regCustomCategory');
            if(value === 'Other') {
                customGroup.classList.remove('hidden');
                customInput.required = true;
            } else {
                customGroup.classList.add('hidden');
                customInput.required = false;
            }
        }

        function showMessage(text, type) {
            msgDiv.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check' : 'fa-exclamation-triangle'}"></i> ` + text;
            msgDiv.className = `msg-box ${type}`;
            msgDiv.style.display = 'block';
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const code = document.getElementById('loginCode').value.trim();
            const btn = this.querySelector('button[type="submit"]');
            
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            btn.disabled = true;

            try {
                const response = await fetch('data/accounts.json');
                if(!response.ok) throw new Error("Database connection failed.");
                const accounts = await response.json();

                const user = accounts.find(acc => acc.email.toLowerCase() === email && acc.code === code);

                if (user) {
                    if(user.status !== "active") {
                        showMessage("Account is inactive. Please contact support.", "error");
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                        return;
                    }

                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('username', user.email);
                    localStorage.setItem('userData', JSON.stringify({
                        name: user.name,
                        role: user.role,
                        company: user.company || "N/A"
                    }));
                    
                    showMessage("Access Granted! Redirecting...", 'success');
                    setTimeout(() => { window.location.href = 'index.html'; }, 1500);

                } else {
                    showMessage("Invalid Email or Access Code.", 'error');
                    if (typeof turnstile !== 'undefined') turnstile.reset();
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                showMessage("System Error: Could not load accounts database.", 'error');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending Application...';
            btn.disabled = true;

            const formData = new FormData(this);
            formData.append("Account_Type", currentAccountType); 

            try {
                const response = await fetch("https://formspree.io/f/xvznnddk", {
                    method: "POST",
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    showMessage("Application received! We will contact you soon with your access code.", 'success');
                    document.getElementById('registerForm').reset();
                    setTimeout(() => switchForm('login'), 4000);
                } else {
                    showMessage("Oops! There was a problem submitting your form.", 'error');
                }
            } catch (error) {
                showMessage("Network error. Please try again later.", 'error');
            }

            btn.innerHTML = originalText;
            btn.disabled = false;
        });
    </script>
</body>
</html>
