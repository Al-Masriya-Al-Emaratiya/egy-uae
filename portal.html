<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Apply for Membership | Al Masriya Al Emaratiya</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <style>
        body { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 40px 20px; 
            background-color: var(--bg-dark);
            font-family: var(--font-sans);
            position: relative;
        }

        .portal-wrapper { 
            width: 100%; 
            max-width: 650px; 
            position: relative; 
            z-index: 10; 
        }
        
        .portal-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 45px;
            box-shadow: 0 15px 45px rgba(4, 77, 161, 0.04);
            transition: var(--transition);
        }

        .portal-header { 
            text-align: center; 
            margin-bottom: 35px; 
        }
        
        .portal-header h2 { 
            font-size: 1.8rem; 
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 10px; 
        }

        .portal-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .account-type-selector { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 25px; 
        }
        
        .account-type-selector .btn { 
            flex: 1; 
            padding: 12px; 
            font-size: 0.85rem;
        }

        .input-group select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            padding: 15px 20px 15px 50px;
            outline: none;
            font-family: inherit;
            font-size: 0.9rem;
            transition: var(--transition);
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        .input-group select:focus {
            border-color: var(--primary);
        }

        .input-group.select-wrapper::after {
            content: '\f107';
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
            position: absolute;
            right: 20px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .msg-box { 
            margin-top: 25px; 
            padding: 15px 20px; 
            border-radius: 12px;
            border-left: 4px solid var(--primary); 
            background: var(--bg-card-hover); 
            display: none; 
            font-weight: 600; 
            font-size: 0.9rem; 
        }

        .msg-box.error { 
            border-left-color: var(--accent); 
            color: var(--accent); 
        }

        .msg-box.success { 
            border-left-color: #10b981; 
            color: #10b981; 
        }

        .cf-turnstile { 
            display: flex; 
            justify-content: center; 
            margin: 20px 0; 
        }

        .grid-2-inputs { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
        }

        .full-width { 
            grid-column: span 2; 
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) { 
            .grid-2-inputs { 
                grid-template-columns: 1fr; 
            } 
            .full-width { 
                grid-column: span 1; 
            } 
            .portal-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div id="tech-cursor"></div>
    <div id="tech-cursor-follower"></div>

    <div class="portal-wrapper">
        <div class="portal-card">
            
            <div class="portal-header">
                <h2 class="gradient-text">AL MASRIYA AL EMARATIYA</h2>
                <p>Global Trading Portal — Apply for Membership</p>
                <div class="header-line" style="margin: 15px auto 0 auto;"></div>
            </div>
            
            <div id="registerSection">
                <div class="account-type-selector">
                    <button type="button" class="btn btn-tech" id="btnIndividual" onclick="setAccountType('individual')">Individual</button>
                    <button type="button" class="btn btn-outline-tech" id="btnCompany" onclick="setAccountType('company')">Company</button>
                </div>

                <!-- نموذج الإرسال المباشر -->
                <form id="registerForm">
                    <div class="grid-2-inputs">
                        <div class="input-group full-width">
                            <input type="text" name="Account_Manager" id="regName" placeholder="Full Name (Account Manager)" required>
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="input-group">
                            <input type="email" name="Email" id="regEmail" placeholder="Business Email" required>
                            <i class="fas fa-envelope"></i>
                        </div>
                        <div class="input-group">
                            <input type="tel" name="Phone_WhatsApp" id="regPhone" placeholder="Phone (WhatsApp)" required>
                            <i class="fas fa-phone"></i>
                        </div>
                        
                        <div class="input-group full-width select-wrapper">
                            <select name="Business_Sector" id="regBusinessCategory" onchange="checkCategory(this.value)" required>
                                <option value="" disabled selected>Select Business Sector...</option>
                                <option value="General Trading">General Trading</option>
                                <option value="Import & Export">Import & Export</option>
                                <option value="Logistics & Shipping">Logistics & Shipping</option>
                                <option value="Agriculture & Food">Agriculture & Food Industry</option>
                                <option value="Textiles & Garments">Textiles & Garments</option>
                                <option value="Electronics & Tech">Electronics & Technology</option>
                                <option value="Building Materials">Construction & Building</option>
                                <option value="Other">Other Sector...</option>
                            </select>
                            <i class="fas fa-tags"></i>
                        </div>

                        <div class="input-group full-width hidden" id="customCategoryGroup">
                            <input type="text" name="Custom_Sector" id="regCustomCategory" placeholder="Please specify your business sector">
                            <i class="fas fa-pen"></i>
                        </div>

                        <div class="input-group company-field hidden full-width">
                            <input type="text" name="Company_Name" id="regCompanyName" placeholder="Official Company Name">
                            <i class="fas fa-building"></i>
                        </div>
                        <div class="input-group company-field hidden full-width">
                            <input type="text" name="Commercial_Registration" id="regSerial" placeholder="Commercial Registration No. (CR)">
                            <i class="fas fa-file-contract"></i>
                        </div>
                    </div>
                    
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAADc5YsoI3mSefPp2" data-theme="light"></div>

                    <button type="submit" class="btn btn-tech w-full">
                        <i class="fas fa-paper-plane"></i> Submit Application
                    </button>
                </form>
            </div>

            <div id="responseMsg" class="msg-box"></div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

    <script>
        let currentAccountType = 'individual';
        const msgDiv = document.getElementById('responseMsg');

        if (typeof VanillaTilt !== 'undefined') {
            VanillaTilt.init(document.querySelector(".portal-card"), {
                max: 3,
                speed: 300,
                glare: true,
                "max-glare": 0.05
            });
        }

        function setAccountType(type) {
            currentAccountType = type;
            const compFields = document.querySelectorAll('.company-field');
            const btnInd = document.getElementById('btnIndividual');
            const btnComp = document.getElementById('btnCompany');

            if(type === 'company') {
                btnComp.className = 'btn btn-tech';
                btnInd.className = 'btn btn-outline-tech';
                compFields.forEach(f => f.classList.remove('hidden'));
                document.getElementById('regCompanyName').required = true;
                document.getElementById('regSerial').required = true;
            } else {
                btnInd.className = 'btn btn-tech';
                btnComp.className = 'btn btn-outline-tech';
                compFields.forEach(f => f.classList.add('hidden'));
                document.getElementById('regCompanyName').required = false;
                document.getElementById('regSerial').required = false;
            }
        }

        function checkCategory(value) {
            const customGroup = document.getElementById('customCategoryGroup');
            const customInput = document.getElementById('regCustomCategory');
            if(value === 'Other') {
                customGroup.classList.remove('hidden');
                customInput.required = true;
            } else {
                customGroup.classList.add('hidden');
                customInput.required = false;
            }
        }

        function showMessage(text, type) {
            msgDiv.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check' : 'fa-exclamation-triangle'}"></i> ` + text;
            msgDiv.className = `msg-box ${type}`;
            msgDiv.style.display = 'block';
        }

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending Application...';
            btn.disabled = true;

            const formData = new FormData(this);
            formData.append("Account_Type", currentAccountType); 

            try {
                const response = await fetch("https://formspree.io/f/xvznnddk", {
                    method: "POST",
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    showMessage("Application received! We will contact you soon via email or WhatsApp.", 'success');
                    document.getElementById('registerForm').reset();
                    if (typeof turnstile !== 'undefined') turnstile.reset();
                } else {
                    showMessage("There was a problem submitting your form. Please try again.", 'error');
                }
            } catch (error) {
                showMessage("Network error. Please check your connection and try again.", 'error');
            }

            btn.innerHTML = originalText;
            btn.disabled = false;
        });

        const cursor = document.getElementById('tech-cursor');
        const follower = document.getElementById('tech-cursor-follower');
        if (cursor && follower) {
            document.addEventListener('mousemove', (e) => {
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
                
                setTimeout(() => {
                    follower.style.left = e.clientX + 'px';
                    follower.style.top = e.clientY + 'px';
                }, 50);
            });
        }
    </script>
</body>
</html>
