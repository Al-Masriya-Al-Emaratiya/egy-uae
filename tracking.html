<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shipment Tracking — Al Masriya Al Emaratia</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="stylesheet" href="css/style.css" />

    <style>
        
        .search-box-wrapper {
            max-width: 700px;
            margin: 40px auto 0;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 30px;
            box-shadow: 6px 6px 0 var(--primary-glow);
        }

        .map-card {
            padding: 10px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-bottom: 4px solid var(--primary);
            box-shadow: 6px 6px 0 var(--primary-glow);
            transition: var(--transition);
        }
        .map-card:hover {
            border-bottom-color: var(--secondary);
            box-shadow: 8px 8px 0 var(--secondary-glow);
        }
        #map { 
            height: 480px; 
            width: 100%; 
            z-index: 1; 
        }

        .leaflet-container {
            background-color: var(--bg-main) !important;
            font-family: 'Tajawal', sans-serif;
        }
        .leaflet-bar a {
            background-color: var(--bg-surface) !important;
            color: var(--primary) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 0 !important;
            transition: var(--transition);
        }
        .leaflet-bar a:hover {
            background-color: var(--primary) !important;
            color: #fff !important;
        }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: var(--bg-surface) !important;
            color: var(--text-main) !important;
            border-radius: 0 !important;
            border: 1px solid var(--border-color) !important;
            box-shadow: 4px 4px 0 var(--primary-glow) !important;
        }

        .timeline-container {
            background: var(--bg-surface);
            padding: 40px;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary);
            box-shadow: 6px 6px 0 var(--primary-glow);
        }
        .timeline-container h3 {
            margin-bottom: 35px;
            font-size: 1.5rem;
            font-weight: 900;
        }
        
        .t-item { 
            position: relative; 
            padding-left: 50px; 
            padding-bottom: 35px; 
        }
        .t-item::before { 
            content: ''; 
            position: absolute; 
            left: 19px; 
            top: 0; 
            width: 2px; 
            height: 100%; 
            background: var(--border-color); 
        }
        .t-item:last-child::before { 
            display: none; 
        }
        
        .t-icon {
            position: absolute; 
            left: 0; 
            top: 0; 
            width: 40px; 
            height: 40px;
            background: var(--bg-surface); 
            border: 2px solid var(--border-color); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 2;
            color: var(--text-muted); 
            transition: var(--transition); 
            font-size: 1rem;
        }
        
        .t-item.completed::before { 
            background: var(--primary); 
        }
        .t-item.completed .t-icon { 
            border-color: var(--primary); 
            color: var(--primary); 
            box-shadow: 0 0 10px var(--primary-glow); 
        }
        .t-item.active .t-icon { 
            background: var(--secondary); 
            color: #fff; 
            border-color: var(--secondary); 
            box-shadow: 0 0 15px var(--secondary-glow); 
        }
        
        .t-content { 
            background: var(--bg-main); 
            padding: 20px 25px; 
            border: 1px solid var(--border-color); 
            transition: var(--transition); 
        }
        .t-item:hover .t-content { 
            border-color: var(--primary); 
            transform: translateX(5px); 
            background: #fff;
            box-shadow: 4px 4px 0 var(--primary-glow);
        }
        .t-content h5 { 
            margin: 0 0 8px; 
            font-size: 1.15rem; 
            font-weight: 700; 
            color: var(--primary); 
        }
        .t-content p { 
            margin: 0; 
            font-size: 0.95rem; 
            color: var(--text-muted); 
        }
        .t-content span { 
            color: var(--secondary); 
            font-weight: 700; 
            margin-left: 5px; 
        }

        [dir="rtl"] .search-box-wrapper {
            box-shadow: -6px 6px 0 var(--primary-glow);
        }
        [dir="rtl"] .map-card {
            box-shadow: -6px 6px 0 var(--primary-glow);
        }
        [dir="rtl"] .map-card:hover {
            box-shadow: -8px 8px 0 var(--secondary-glow);
        }
        [dir="rtl"] .timeline-container {
            border-left: none;
            border-right: 4px solid var(--primary);
            box-shadow: -6px 6px 0 var(--primary-glow);
        }
        [dir="rtl"] .t-item {
            padding-left: 0;
            padding-right: 50px;
        }
        [dir="rtl"] .t-item::before {
            left: auto;
            right: 19px;
        }
        [dir="rtl"] .t-icon {
            left: auto;
            right: 0;
        }
        [dir="rtl"] .t-item:hover .t-content {
            transform: translateX(-5px);
            box-shadow: -4px 4px 0 var(--primary-glow);
        }
        [dir="rtl"] .t-content span {
            margin-left: 0;
            margin-right: 5px;
        }

        #result-section { 
            display: none; 
            animation: popIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; 
            opacity: 0; 
            transform: translateY(30px); 
        }
        @keyframes popIn { 
            to { 
                opacity: 1; 
                transform: translateY(0); 
            } 
        }

        @media (max-width: 768px) {
            .search-box-wrapper { padding: 20px; }
            .timeline-container { padding: 25px 15px; }
            .t-item { padding-left: 40px; }
            [dir="rtl"] .t-item { padding-right: 40px; padding-left: 0; }
            .t-icon { width: 34px; height: 34px; }
            .t-item::before { left: 16px; }
            [dir="rtl"] .t-item::before { right: 16px; left: auto; }
            [dir="rtl"] .t-icon { right: 0; left: auto; }
        }
    </style>
</head>
<body>

    <div id="progress-bar"></div>
    <div id="tech-cursor"></div>
    <div id="tech-cursor-follower"></div>
    <div class="animated-lines-container" id="lines-container"></div>

    <header class="tech-header">
        <div class="container header-container">
            <div class="logo-area">
                <span style="font-family: 'Cairo'; font-weight: 900; font-size: 1.4rem; color: var(--primary); letter-spacing: 0.5px;">
                    AL MASRIYA AL EMARATIA
                </span>
            </div>
            <div class="header-actions">
                <a href="tracking-ar.html" class="btn btn-outline-tech"><i class="fas fa-globe"></i> العربية</a>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <div class="section-header">
                <span class="tech-badge">Live Tracking System</span>
                <h2>Global Shipment Tracking</h2>
                <div class="header-line"></div>
            </div>

            <div class="search-box-wrapper">
                <div class="input-group">
                    <input type="text" id="trackInput" placeholder="Enter Container or B/L Number...">
                    <i class="fas fa-search"></i>
                </div>
                <button class="btn btn-tech w-full mt-4" onclick="startTracking()">
                    <i class="fas fa-satellite-dish"></i> Track Shipment
                </button>
            </div>
        </div>
    </section>

    <main class="container mb-4">
        <div id="result-section">
            
            <div class="grid grid-3 mb-4">
                <div class="tech-card">
                    <div class="icon-box">
                        <i class="fas fa-ship"></i>
                    </div>
                    <h3>Vessel Name</h3>
                    <p id="vessel-name" style="font-size: 1.25rem; font-weight: 700; color: var(--text-main);">---</p>
                </div>
                <div class="tech-card">
                    <div class="icon-box">
                        <i class="fas fa-signal"></i>
                    </div>
                    <h3>Current Status</h3>
                    <p id="status" class="text-red" style="font-size: 1.25rem; font-weight: 700;">---</p>
                </div>
                <div class="tech-card">
                    <div class="icon-box">
                        <i class="fas fa-map-marked-alt"></i>
                    </div>
                    <h3>Final Destination</h3>
                    <p id="destination" style="font-size: 1.25rem; font-weight: 700; color: var(--text-main);">---</p>
                </div>
            </div>

            <div class="map-card mb-4">
                <div id="map"></div>
            </div>

            <div class="timeline-container">
                <h3 class="text-white" style="color: var(--primary) !important;">
                    <i class="fas fa-route" style="color: var(--secondary); margin-right: 10px;"></i> Shipment Milestones
                </h3>
                <div id="timeline-list"></div>
            </div>
            
        </div>
    </main>

    <footer class="tech-footer" style="padding: 40px 0 20px;">
        <div class="container text-center">
            <p class="footer-bottom" style="margin-top: 0; border-top: none;">
                &copy; 2026 Al Masriya Al Emaratia. All Rights Reserved. Powered by Tech OS.
            </p>
        </div>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('lines-container');
            if (container) {
                const createLine = () => {
                    if (document.querySelectorAll('.data-stream').length > 15) return;
                    const line = document.createElement('div');
                    line.classList.add('data-stream');
                    line.style.left = Math.random() * 100 + '%';
                    line.style.animationDelay = Math.random() * 2 + 's';
                    line.style.animationDuration = (8 + Math.random() * 6) + 's';
                    container.appendChild(line);
                    line.addEventListener('animationend', () => line.remove());
                };
                for (let i = 0; i < 8; i++) createLine();
                setInterval(createLine, 2000);
            }

            const cursor = document.getElementById('tech-cursor');
            const follower = document.getElementById('tech-cursor-follower');
            
            if (cursor && follower && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
                document.addEventListener('mousemove', (e) => {
                    cursor.style.left = e.clientX + 'px';
                    cursor.style.top = e.clientY + 'px';
                    
                    follower.animate({
                        left: e.clientX + 'px',
                        top: e.clientY + 'px'
                    }, { duration: 150, fill: 'forwards' });
                });
            }
        });

        window.addEventListener('scroll', () => {
            const winScroll = document.documentElement.scrollTop || document.body.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            const bar = document.getElementById('progress-bar');
            if (bar) bar.style.width = scrolled + '%';
        });

        let map;

        async function startTracking() {
            const id = document.getElementById('trackInput').value.trim();
            if(!id) return;

            try {
                const response = await fetch('shipments.json');
                const data = await response.json();
                const ship = data.find(s => s.tracking_id === id);

                if (ship) {
                    document.getElementById('result-section').style.display = 'block';
                    renderData(ship);
                    initMap(ship.current_location);
                    
                    setTimeout(() => {
                        document.getElementById('result-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 180);
                } else {
                    alert("ID not found. Please check and try again.");
                }
            } catch (e) {
                console.error("Fetch error:", e);
                alert("Error fetching data. Ensure 'shipments.json' is available.");
            }
        }

        function renderData(ship) {
            document.getElementById('vessel-name').innerHTML = ship.vessel_name;
            document.getElementById('status').innerHTML = ship.current_status;
            document.getElementById('destination').innerHTML = ship.destination.port;

            const list = document.getElementById('timeline-list');
            list.innerHTML = "";
            ship.milestones.forEach((m, index) => {
                const isLastCompleted = m.completed && (!ship.milestones[index+1] || !ship.milestones[index+1].completed);
                const item = document.createElement('div');
                item.className = `t-item ${m.completed ? 'completed' : ''} ${isLastCompleted ? 'active' : ''}`;
                
                let iconClass = "fa-circle-notch fa-spin";
                if(m.completed) iconClass = "fa-check";
                if(isLastCompleted) iconClass = "fa-anchor";

                item.innerHTML = `
                    <div class="t-icon">
                        <i class="fas ${iconClass}"></i>
                    </div>
                    <div class="t-content">
                        <h5>${m.stage}</h5>
                        <p>${m.location} — <span>${m.date}</span></p>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function initMap(loc) {
            if (map) map.remove();
            map = L.map('map', { zoomControl: true }).setView([loc.lat, loc.lng], 5);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
            
            const shipIcon = L.divIcon({
                className: 'ship-marker',
                html: `<div style="
                    background: linear-gradient(135deg, var(--primary), var(--secondary)); 
                    color:white; width:42px; height:42px; border-radius:0 !important; 
                    display:flex; align-items:center; justify-content:center; 
                    border: 1px solid #fff; 
                    box-shadow: 4px 4px 0 var(--primary-glow);
                    font-size: 1.1rem;
                "><i class="fas fa-ship"></i></div>`,
                iconSize: [42, 42],
                iconAnchor: [21, 21]
            });

            L.marker([loc.lat, loc.lng], {icon: shipIcon}).addTo(map)
                .bindPopup(`
                    <div style="color:var(--text-main); padding:3px; font-family:'Tajawal', sans-serif;">
                        <b style="color:var(--secondary); font-size:1rem; font-family: 'Cairo';">Current Location:</b><br>${loc.name}
                    </div>
                `).openPopup();
        }
    </script>
</body>
</html>
